<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-game-audio</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1a1e26; --muted: #5a6372; --line: #d9dde4;
  --accent: #b45d00; --accent-ink: #ffffff; --on: #2f7d4a;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #12161d; --panel: #1a1f29; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2c3442; --accent: #f0a23c; --accent-ink: #1a1206; --on: #5cc983; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #12161d; --panel: #1a1f29; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2c3442; --accent: #f0a23c; --accent-ink: #1a1206; --on: #5cc983; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font-body); }
main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 24px; }
h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.1; margin: 0; }
h2 { font-size: 20px; margin: 0; }
.lede { color: var(--muted); max-width: 70ch; margin: 6px 0 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mixer { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.mixer label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
button { font: 500 14px var(--font-body); border-radius: 6px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button[aria-pressed="true"] { border-color: var(--on); color: var(--on); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=range] { width: 100%; }
.status { font: 400 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.5em; }
.what { color: var(--muted); font-size: 14px; margin: 0; }
.beat { display: inline-flex; gap: 4px; }
.beat span { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line); }
.beat span.on { background: var(--accent); border-color: var(--accent); }
.layers { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px 12px; }
.layers label { display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
.small { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>my-game-audio</h1>
    <p class="lede">Game music written as text and synthesized in your browser: no audio files. Each song below loops seamlessly from its intro; change cues on the next bar, bring layers in and out, fire stingers over the music, and crossfade between songs. Engine <span id="version"></span>.</p>
  </header>

  <section class="panel" aria-labelledby="mix-h">
    <div class="row" style="justify-content: space-between">
      <h2 id="mix-h">Mixer</h2>
      <div class="row"><span class="beat" id="beat" aria-label="Beats of the bar"></span><span class="status" id="pos">Not playing</span></div>
    </div>
    <div class="mixer" id="mixer"></div>
    <div class="row">
      <button type="button" id="duck" aria-pressed="false">Duck music</button>
      <button type="button" id="stop-all">Stop music</button>
      <span class="status" id="cache"></span>
    </div>
  </section>

  <section aria-labelledby="music-h" style="display: grid; gap: 12px">
    <h2 id="music-h">Music</h2>
    <div class="grid" id="songs"></div>
  </section>
</main>
<script>/*DIST*/</script>
<script type="application/json" id="song-data">/*SONGS*/</script>
<script>
(() => {
  const A = window.MyGameAudio;
  const songs = JSON.parse(document.getElementById('song-data').textContent);
  const el = (id) => document.getElementById(id);
  const h = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null) e.setAttribute(k, v);
    }
    for (const k of kids) e.append(k);
    return e;
  };
  el('version').textContent = A.VERSION;
  const player = A.createPlayer();
  const demo = (window.demo = { player, songs, log: [], playing: null });

  // the mixer: a volume and a mute per bus
  for (const bus of ['master', 'music', 'sfx', 'voice']) {
    const range = h('input', { type: 'range', min: 0, max: 1, step: 0.01, value: 1, 'aria-label': bus + ' volume', oninput: (e) => player.volume(bus, +e.target.value) });
    const mute = h('button', { type: 'button', 'aria-pressed': 'false', onclick: (e) => e.target.setAttribute('aria-pressed', String(player.mute(bus))) }, 'Mute');
    el('mixer').append(h('label', {}, bus[0].toUpperCase() + bus.slice(1), range, mute));
  }
  el('duck').addEventListener('click', (e) => {
    const on = e.target.getAttribute('aria-pressed') !== 'true';
    player.duck(on);
    e.target.setAttribute('aria-pressed', String(on));
  });
  el('stop-all').addEventListener('click', () => { player.stop({ fade: 0.5 }); demo.playing = null; refresh(); });

  // the beat indicator and position, from the player's beat callbacks
  const dots = [];
  for (let i = 0; i < 4; i++) { const d = h('span'); dots.push(d); el('beat').append(d); }
  player.onBeat((p) => {
    demo.log.push({ t: performance.now(), bar: p.bar, beat: p.beat });
    dots.forEach((d, i) => d.classList.toggle('on', i === p.beat));
  });
  setInterval(() => {
    const p = player.pos;
    el('pos').textContent = p.playing ? `${p.cue} · bar ${p.bar + 1} beat ${p.beat + 1}${p.inIntro ? ' (intro)' : ` · loop ${p.pass + 1}`}` : 'Not playing';
    const s = player.stats;
    el('cache').textContent = `renders ${s.renders}, streamed starts ${s.streams}, cache hits ${s.cacheHits}`;
    refresh();
  }, 100);

  const cards = {};
  function refresh() {
    for (const [name, c] of Object.entries(cards)) {
      const cur = player.cur && player.cur.song === songs[name] ? player.cur : null;
      c.status.textContent = cur ? (cur.streaming ? 'Playing while it renders (estimated loudness)' : `Looping: cue ${cur.cue}, rendered in ${(cur.d.stats.renderMs / 1000).toFixed(1)} s`) : c.idle;
      for (const [cue, b] of Object.entries(c.cueButtons)) b.setAttribute('aria-pressed', String(!!cur && cur.cue === cue));
    }
  }
  demo.play = async (name, o = {}) => {
    await player.unlock();
    const t0 = performance.now();
    const fade = player.cur ? 1.5 : 0.05;
    const inst = await player.music(songs[name], { fade, at: player.cur ? 'bar' : 'now', ...o });
    demo.playing = name;
    demo.startMs = performance.now() - t0;
    refresh();
    return inst;
  };

  // one card per song: play, cues, layers, stingers
  for (const [name, song] of Object.entries(songs)) {
    const cues = Object.keys(A.cuesOf(song));
    const layers = Object.keys(A.layersOf(song));
    const status = h('p', { class: 'status', id: `status-${name}` });
    const card = h('article', { class: 'panel', id: `card-${name}` },
      h('h2', {}, song.title), h('p', { class: 'what' }, `${song.style} · ${song.key} · ${song.bpm} BPM`));
    const cueButtons = {};
    const row = h('div', { class: 'row' }, h('button', { type: 'button', class: 'primary', id: `play-${name}`, onclick: () => demo.play(name) }, 'Play'));
    if (cues.length > 1) for (const cue of cues) {
      cueButtons[cue] = h('button', { type: 'button', id: `cue-${name}-${cue}`, 'aria-pressed': 'false', onclick: async () => {
        if (player.cur?.song !== song) await demo.play(name, { cue });
        else await player.cue(cue, { at: 'bar' });
        refresh();
      } }, `Cue: ${cue}`);
      row.append(cueButtons[cue]);
    }
    for (const st of Object.keys(song.stingers ?? {})) row.append(h('button', { type: 'button', id: `sting-${name}-${st}`, onclick: () => player.cur?.song === song && player.sting(st, { at: 'beat' }) }, `Stinger: ${st}`));
    card.append(row);
    if (layers.length > 1) {
      const box = h('div', { class: 'layers' });
      for (const l of layers) box.append(h('label', {}, `Layer: ${l}`, h('input', { type: 'range', min: 0, max: 1, step: 0.01, value: 1, id: `layer-${name}-${l}`, 'aria-label': `${l} layer`, oninput: (e) => player.cur?.song === song && player.layer(l, +e.target.value, 0.3) })));
      card.append(box);
    }
    card.append(status, h('p', { class: 'small' }, song.note || ''));
    cards[name] = { status, cueButtons, idle: `${cues.length} cue${cues.length > 1 ? 's' : ''}, ${layers.length} layer${layers.length > 1 ? 's' : ''}` };
    el('songs').append(card);
  }
  refresh();
})();
</script>
</body>
</html>
