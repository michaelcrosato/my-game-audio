# Runs the test suite and the health check on every push and pull request.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
  page:
    # the demo page in headless Chromium, on the player in dist/ (tools/page_test.mjs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run page:test
  importers:
    # the JavaScript MusicXML importer against tools/import_orchestra.py (music21) on the test scores, and the
    # JavaScript ears against tools/ears.py
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install music21==10.5.2
      - run: npm ci
      - run: node --test test/musicxml-python.test.mjs
        env:
          MGA_PYTHON: '1'
      - run: pip install numpy scipy pyloudnorm matplotlib
      - run: node --test test/ears.test.mjs
        env:
          MGA_PYTHON: '1'
  cues:
    # every cue of the three cue sets and the ABC songbook, rendered as a game plays it (head, then the loop twice)
    # and judged by the JavaScript ears: no clicks, true peak at or under -1 dBTP, loudness within 2 LU of -16 LUFS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ears -- songs/set_chiptune.mjs songs/set_synthwave.mjs songs/set_orchestral.mjs songs/lantern_road.mjs
